services:
  app:
    build:
      context: .
    image: imideas-grind:latest
    container_name: imideas-grind
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:?APP_ENV_FILE must point to the Jenkins secret file}
    networks:
      - imideas-net

networks:
  imideas-net:
    external: true
